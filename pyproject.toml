[project]
name = "ha-netcup"
version = "0.1.0"
description = "Home Assistant integration for the netcup Server Control Panel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "TRY"]
ignore = ["PLR0913", "PLR2004", "TRY003", "TRY400", "E501"]
